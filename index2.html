<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bienvenidos | ValFer Cosmetic</title>

    <link rel="stylesheet" href="estilos.css">

</head>


<body class="pagina-bienvenida">

    <!-- CONTENIDO PRINCIPAL -->

    <main class="bienvenida">

        <section class="tarjeta-bienvenida">

            <!-- LOGO -->

            <img src="img/valfer logo.jpeg"
                 alt="ValFer Cosmetic"
                 class="logo-bienvenida">


            <!-- TÍTULO -->

            <h1>
                ✨ ¡Bienvenidx a ValFer Cosmetic! ✨
            </h1>


            <!-- DESCRIPCIÓN -->

            <p>
                Descubre nuestros cosméticos, accesorios,
                regalos y detallitos personalizados.
            </p>

            <p>
                💕 Ingresa tu correo para conocer nuestro catálogo.
            </p>


            <!-- FORMULARIO -->

            <form id="formMarketing">

                <input
                    type="email"
                    id="correoMarketing"
                    placeholder="Tu correo electrónico"
                >

                <button type="submit" class="btn">
                    Entrar a la tienda
                </button>

            </form>


            <!-- MENSAJE -->

            <p class="mensaje-privacidad">
                💜 No enviaremos spam, lo prometemos.
            </p>

        </section>

    </main>


    <!-- JAVASCRIPT -->

    <script>

        document
            .getElementById('formMarketing')
            .addEventListener('submit', function(e) {

                e.preventDefault();

                // Ir al inicio
                window.location.href = 'index.html';

            });

    </script>

</body>

</html>
