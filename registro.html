<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta | ValFer Cosmetic</title>

    <link rel="stylesheet" href="estilos.css">

</head>


<body>


    <header class="encabezado-login">

        <h1>💜 ValFer Cosmetic</h1>

        <p>Crear una nueva cuenta</p>

    </header>


    <main class="login-container">

        <section class="login-card">


            <h2>Crear cuenta</h2>

            <p class="texto-login">

                Regístrate en ValFer Cosmetic ✨

            </p>


            <!-- Nombre -->

            <label for="nombre">

                Nombre completo

            </label>

            <input
                type="text"
                id="nombre"
                placeholder="Escribe tu nombre"
            >


            <!-- Correo -->

            <label for="correo">

                Correo electrónico

            </label>

            <input
                type="email"
                id="correo"
                placeholder="ejemplo@gmail.com"
            >


            <!-- Teléfono -->

            <label for="telefono">

                Teléfono

            </label>

            <input
                type="tel"
                id="telefono"
                placeholder="449 123 4567"
            >


            <!-- Contraseña -->

            <label for="password">

                Contraseña

            </label>

            <input
                type="password"
                id="password"
                placeholder="Crea una contraseña"
            >


            <!-- Confirmar contraseña -->

            <label for="confirmar">

                Confirmar contraseña

            </label>

            <input
                type="password"
                id="confirmar"
                placeholder="Repite tu contraseña"
            >


            <!--
            Al presionar el botón,
            vamos directamente al perfil.
            -->

            <a
                href="perfil.html"
                class="boton">

                Crear cuenta 💜

            </a>


            <div class="separador">

                ¿Ya tienes una cuenta?

            </div>


            <a
                href="login.html"
                class="boton-secundario">

                Iniciar sesión

            </a>


            <a
                href="index.html"
                class="volver">

                ← Regresar al inicio

            </a>

        </section>

    </main>

</body>

</html>
