<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi perfil | ValFer Cosmetic</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <header class="encabezado-login">
        <h1>💜 ValFer Cosmetic</h1>
        <p>Mi perfil</p>
    </header>

    <main class="login-container">
        <section class="login-card">

            <h2>Mi perfil 👤</h2>

            <!-- Foto de perfil -->
            <div class="foto-perfil">
                👤
            </div>

            <p class="texto-login">
                Aquí puedes modificar tus datos.
            </p>

            <!-- Formulario de datos -->
            <label>Nombre</label>
            <input type="text" placeholder="Tu nombre">

            <label>Correo electrónico</label>
            <input type="email" placeholder="Tu correo">

            <label>Teléfono</label>
            <input type="tel" placeholder="Tu teléfono">

            <label>Dirección</label>
            <input type="text" placeholder="Tu dirección">

            <!-- Botón Guardar -->
            <a href="perfil.html" class="boton">
                💾 Guardar cambios
            </a>

            <!-- Botones de Acción -->
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin: 20px 0;">
                <button type="button" class="btn btn-secundario" onclick="mostrarAlerta('Aquí verás el estado de tus compras en tránsito.', '🛍️ Mis compras')">
                    🛍️ Mis compras
                </button>
            </div>

            <!-- Regresar -->
            <a href="index.html" class="volver">
                🏠 Volver a ValFer Cosmetic
            </a>

            <!-- Cerrar sesión -->
            <a href="login.html" class="boton-secundario">
                🚪 Cerrar sesión
            </a>

        </section>
    </main>

    <!-- Modal de Alerta Personalizada (Diseño propio de la página) -->
    <div id="customAlert" class="modal-overlay" style="display: none;">
        <div class="modal-box" style="max-width: 350px;">
            <h3 id="alertTitulo" style="color: var(--color-principal, #6a1b9a); margin-bottom: 15px;">Aviso</h3>
            <p id="alertMensaje" style="margin-bottom: 20px; line-height: 1.5;">Mensaje</p>
            <button type="button" class="btn" onclick="cerrarAlerta()">Aceptar</button>
        </div>
    </div>

    <!-- Scripts de la funcionalidad -->
    <script>
        function mostrarAlerta(mensaje, titulo = 'Aviso', accion = null) {
            document.getElementById('alertTitulo').innerText = titulo;
            document.getElementById('alertMensaje').innerText = mensaje;
            document.getElementById('customAlert').style.display = 'flex';
            window.accionPostAlerta = accion;
        }

        function cerrarAlerta() {
            document.getElementById('customAlert').style.display = 'none';
            if (window.accionPostAlerta) {
                window.accionPostAlerta();
                window.accionPostAlerta = null;
            }
        }
    </script>

</body>
</html>
