<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mi perfil | ValFer Cosmetic</title>

    <link rel="stylesheet" href="estilos.css">

</head>


<body>


    <header class="encabezado-login">

        <h1>💜 ValFer Cosmetic</h1>

        <p>Mi perfil</p>

    </header>


    <main class="login-container">

        <section class="login-card">


            <h2>Mi perfil 👤</h2>


            <!-- Foto de perfil -->

            <div class="foto-perfil">

                👤

            </div>


            <p class="texto-login">

                Aquí puedes modificar tus datos.

            </p>


            <!-- Nombre -->

            <label>

                Nombre

            </label>

            <input
                type="text"
                placeholder="Tu nombre"
            >


            <!-- Correo -->

            <label>

                Correo electrónico

            </label>

            <input
                type="email"
                placeholder="Tu correo"
            >


            <!-- Teléfono -->

            <label>

                Teléfono

            </label>

            <input
                type="tel"
                placeholder="Tu teléfono"
            >


            <!-- Dirección -->

            <label>

                Dirección

            </label>

            <input
                type="text"
                placeholder="Tu dirección"
            >


            <!-- Botón -->

            <a
                href="perfil.html"
                class="boton">

                💾 Guardar cambios

            </a>


            <!-- Regresar -->

            <a
                href="index.html"
                class="volver">

                🏠 Volver a ValFer Cosmetic

            </a>


            <!-- Cerrar sesión -->

            <a
                href="login.html"
                class="boton-secundario">

                🚪 Cerrar sesión

            </a>

        </section>

    </main>


</body>

</html>
