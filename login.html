<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | ValFer Cosmetic</title>

    <link rel="stylesheet" href="estilos.css">

</head>


<body>

    <main class="login-container">

        <section class="login-card">


            <!-- Encabezado -->

            <div class="login-header">

                <h1>ValFer Cosmetic 💜</h1>

                <p>
                    ¡Bienvenidx de nuevo!
                </p>

            </div>


            <!-- Login -->

            <form id="loginForm">


                <!-- Correo -->

                <div class="input-group">

                    <label for="loginCorreo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="loginCorreo"
                        placeholder="ejemplo@gmail.com"
                        required>

                </div>


                <!-- Contraseña -->

                <div class="input-group">

                    <label for="loginPassword">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Tu contraseña"
                        required>

                </div>


                <!-- Botón -->

                <button
                    type="submit"
                    class="login-button">

                    Iniciar sesión

                </button>


            </form>


            <!-- Crear cuenta -->

            <div class="register">

                <p>
                    ¿No tienes una cuenta?

                    <a href="registro.html">
                        Crear cuenta
                    </a>

                </p>

            </div>


            <!-- Regresar -->

            <div class="back-home">

                <a href="index.html">
                    ← Regresar al inicio
                </a>

            </div>


        </section>

    </main>


    <script src="login.js"></script>

</body>

</html>
