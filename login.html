<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | ValFer Cosmetic</title>

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <header class="encabezado-login">

        <h1>💜 ValFer Cosmetic</h1>

        <p>Cosméticos, belleza y regalos</p>

    </header>


    <main class="login-container">

        <section class="login-card">

            <h2>Iniciar sesión</h2>

            <p class="texto-login">
                ¡Qué bonito tenerte de vuelta! ✨
            </p>


            <!-- Correo -->

            <label for="correo">
                Correo electrónico
            </label>

            <input
                type="email"
                id="correo"
                placeholder="ejemplo@gmail.com"
            >


            <!-- Contraseña -->

            <label for="password">
                Contraseña
            </label>

            <input
                type="password"
                id="password"
                placeholder="Escribe tu contraseña"
            >


            <!-- Este enlace lleva al perfil. -->

            <a href="perfil.html" class="boton">

                Iniciar sesión

            </a>


            <!-- Crear cuenta -->

            <div class="separador">

                ¿No tienes una cuenta?

            </div>


            <a
                href="registro.html"
                class="boton-secundario">

                Crear una cuenta

            </a>


            <a
                href="index.html"
                class="volver">

                ← Regresar al inicio

            </a>

        </section>

    </main>

</body>

</html>
