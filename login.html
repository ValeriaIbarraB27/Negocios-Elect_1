<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | ValFer Cosmetic</title>

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <header class="encabezado-login">

        <h1>💜 ValFer Cosmetic</h1>

        <p>Cosméticos, belleza y regalos</p>

    </header>


    <main class="login-container">

        <section class="login-card">

            <h2>Iniciar sesión</h2>

            <p class="texto-login">
                ¡Qué bonito tenerte de vuelta! ✨
            </p>

            <!-- ENVOLVEMOS EN UN FORMULARIO -->
            <form id="form-login" onsubmit="procesarInicioSesion(event)">

                <!-- Correo -->
                <label for="correo">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correo"
                    placeholder="ejemplo@gmail.com"
                    required
                >

                <!-- Contraseña -->
                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Escribe tu contraseña"
                    required
                >

                <!-- BOTÓN TIPO SUBMIT -->
                <button type="submit" class="boton" style="width: 100%; cursor: pointer; border: none;">
                    Iniciar sesión
                </button>

            </form>

            <!-- Crear cuenta -->
            <div class="separador">
                ¿No tienes una cuenta?
            </div>

            <a
                href="registro.html"
                class="boton-secundario">
                Crear una cuenta
            </a>

            <a
                href="index.html"
                class="volver">
                ← Regresar al inicio
            </a>

        </section>

    </main>

    <!-- SCRIPT PARA GUARDAR LA SESIÓN Y REDIRIGIR A ESTRATEGIAS -->
    <script>
        function procesarInicioSesion(event) {
            event.preventDefault(); // Evita que se recargue la página inmediatamente

            const correo = document.getElementById('correo').value.trim();
            
            // Extraer un nombre de usuario básico a partir del correo (ej: 'valeria' de 'valeria@gmail.com')
            const nombreUsuario = correo.split('@')[0] || 'Usuario';

            // Guardar las claves de sesión activa en localStorage
            localStorage.setItem('valfer_sesion_activa', nombreUsuario);
            localStorage.setItem('valfer_usuario_activo', nombreUsuario);

            // Redirigir a la página de estrategias protegida
            window.location.href = 'estrategias.html';
        }
    </script>

</body>

</html>
